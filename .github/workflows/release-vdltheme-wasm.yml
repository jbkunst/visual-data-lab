name: Release vdltheme WebAssembly

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vdltheme release tag
        required: true
        default: vdltheme-v0.0.1

jobs:
  build-wasm:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'vdltheme-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      repository-projects: read

    steps:
      - uses: r-lib/actions/setup-r@v2

      - name: Checkout vdltheme release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Checkout r-wasm actions
        uses: actions/checkout@v4
        with:
          ref: v3
          repository: r-wasm/actions
          token: ${{ secrets.GITHUB_TOKEN }}
          path: .actions

      - name: Build Wasm image
        uses: ./.actions/build-rwasm
        with:
          packages: "./vdltheme"
          strip: "demo, doc, examples, help, html, include, tests, vignette"
          image-path: ._rwasm
          webr-image: ghcr.io/r-wasm/webr:main

      - name: Upload Wasm image to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "._rwasm/*"
          tag: ${{ github.event.release.tag_name || inputs.tag }}
          file_glob: true
          overwrite: true
