name: Generate SHAP Explorer artifact

on:
  push:
    branches: [add-shap-explorer]
    paths:
      - shap-explorer/prepare_data.R
      - .github/workflows/build-shap-rds.yml

permissions:
  contents: write

jobs:
  build-artifact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: add-shap-explorer

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::modeldata
            any::rpart

      - name: Generate artifact
        shell: bash
        run: |
          mkdir -p shap-explorer/data
          if ! Rscript shap-explorer/prepare_data.R > shap-explorer/prepare.log 2>&1; then
            cat shap-explorer/prepare.log
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add shap-explorer/prepare.log
            git commit -m "Record SHAP artifact generation error" || true
            git push
            exit 1
          fi
          rm -f shap-explorer/prepare.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add shap-explorer/data/shap-credit.rds
          git commit -m "Add SHAP Explorer data artifact"
          git push
